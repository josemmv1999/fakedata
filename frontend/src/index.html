<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Veritas — News fact-checker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Paste a URL or headline and verify claims against real sources."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Sync theme application before paint to avoid a flash of the wrong theme.
      // Mirrors ThemeService.STORAGE_KEY and the same resolution rules.
      (function () {
        try {
          var stored = localStorage.getItem('verifier.theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var effective =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          if (effective === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* no-op: localStorage may be blocked */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
